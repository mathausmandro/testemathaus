# Perfis: dev (hot reload) e prod (imagem final).
#   docker compose --profile dev up --build
#   docker compose --profile prod up --build
# Valores reais ficam em .env.local (fora do repositório), lido por env_file em tempo de execução.
# Dentro do container, o Supabase local do host é acessado por host.docker.internal
# (use NEXT_PUBLIC_SUPABASE_URL=http://host.docker.internal:54321 no .env.local para o container).
services:
  app-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    env_file:
      - .env.local
    environment:
      # Docker Desktop no Windows não propaga eventos de arquivo: polling garante o hot reload.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next_cache:/app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app-prod:
    profiles: ["prod"]
    build:
      context: .
      target: runner
      args:
        # Apenas valores públicos entram no build (embutidos no navegador). Nada de chave secreta.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  app_node_modules:
  app_next_cache:
