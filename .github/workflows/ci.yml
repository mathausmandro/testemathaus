# Pipeline de qualidade (tarefa 002). Só roda quando o repositório remoto no GitHub existir.
# Mesmas etapas do `npm run verify`, mais gitleaks (histórico completo) e publicação de relatórios.
# Regras: permissions mínimas, actions fixadas por SHA, nenhum secret usado, nenhuma chave secreta do Supabase.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 de gitleaks_8.30.1_linux_x64.tar.gz (arquivo de checksums da release oficial)
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks: binário oficial com versão e checksum fixos; varre o histórico inteiro e a árvore atual.
      # --redact impede que o valor de um segredo encontrado apareça no log.
      - name: gitleaks (histórico e árvore de trabalho)
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tar.gz
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --config .gitleaks.toml --redact --no-banner .
          "${RUNNER_TEMP}/gitleaks/gitleaks" dir --config .gitleaks.toml --redact --no-banner .
          # O npm run test:security (dentro do verify) roda o gitleaks de novo e exige o binário no PATH.
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts (S7): a CLI do Supabase 2.122 não tem postinstall, o binário vem de pacote npm
      # com integridade no package-lock. Os únicos scripts de instalação do lock (fsevents e
      # unrs-resolver) são opcionais e dispensáveis no runner Linux.
      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # Supabase local (Docker do runner) para pgTAP e e2e. Sem condição: o config.toml é obrigatório
      # e a etapa pgTAP do verify reprova no CI se o Supabase local não estiver de pé.
      - name: Iniciar Supabase local
        run: npx supabase start

      # Mapeia as chaves do `supabase status` para NEXT_PUBLIC_* (só as públicas; nada de segredo
      # é exportado). Valores são os de teste do Supabase local, descartados com o runner.
      - name: Exportar variáveis públicas do Supabase local
        run: node scripts/setup-local.mjs --github-env

      - name: Verificar (npm run verify)
        run: npm run verify

      # G2 (docs/seguranca/002.md): artefatos não podem levar sessão. O e2e no CI roda sem trace
      # (playwright.config.ts) e o storageState fica em playwright/.auth, fora das pastas enviadas.
      # Defesa extra: apaga qualquer trace, storageState ou HAR que tenha ido parar nelas.
      - name: Remover sessão dos artefatos
        if: always()
        run: |
          set -euo pipefail
          for d in playwright-report test-results; do
            [ -d "$d" ] || continue
            # *.zip cobre os traces copiados pelo relatório HTML para playwright-report/data/<hash>.zip.
            find "$d" -type f \( -name '*.zip' -o -name '*.har' -o -name '*storage*state*.json' -o -path '*/.auth/*' \) -print -delete
          done

      # v7.0.2
      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relatorios-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          # .lighthouseci/ é pasta oculta: sem isto o upload-artifact a ignora.
          # Nenhum caminho acima inclui .env*; o teste do workflow garante isso.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
