# Tarefa 018: aplica migrations no projeto Supabase de TESTE a partir da main.
# Só roda quando o repositório remoto, o environment "teste" e os secrets existirem (pendência do Mathaus).
# Secrets ficam no GitHub (environment "teste"), nunca no repositório. Produção NÃO é aplicada por aqui.
name: Migrations (teste)

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrations-teste
  cancel-in-progress: false

jobs:
  push-teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # B5 (docs/seguranca/003-019.md): só a main usa o environment "teste". No GitHub, o environment
    # também deve ter "Deployment branches: main" (docs/ambientes.md, seção 5); este if é a 2ª barreira.
    if: github.ref == 'refs/heads/main'
    environment: teste
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Vincular e aplicar migrations no projeto de teste
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_TESTE }}
          SUPABASE_PROJECT_REF_TESTE: ${{ secrets.SUPABASE_PROJECT_REF_TESTE }}
        run: |
          node scripts/db-remoto.mjs link teste
          node scripts/db-remoto.mjs push teste
